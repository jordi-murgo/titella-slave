[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titella-slave-assets"
version = "1.1.0"
description = "Deterministic Titella slave payloads, loaders and wire codec"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# _data/ is generated by the build hook into build_lib only; it is never
# present in src/ and therefore needs no source package-data entry.
